[project]
name = "transcriptai"
version = "0.1.0"
description = "Speaker-aware audio transcription with FastAPI and Gemini 2.5 Flash"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.116.0",
    "google-genai>=1.29.0",
    "python-dotenv>=1.1.0",
    "python-multipart>=0.0.20",
    "uvicorn[standard]>=0.35.0",
]

[dependency-groups]
dev = ["httpx>=0.28.1", "pytest>=8.4.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
